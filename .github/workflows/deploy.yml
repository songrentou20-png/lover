name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 134.122.67.50
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/lover
            git pull
            npm run build
